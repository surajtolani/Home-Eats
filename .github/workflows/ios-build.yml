# Builds the app on a real macOS runner with a real Swift compiler — the
# thing no Claude Code session working on this repo can do itself, since
# Claude runs in a Linux sandbox with no Swift toolchain available
# (Xcode/swiftc only exist on macOS). Without this, a change that looks
# correct on a careful manual read of the diff can still fail to compile,
# and nobody finds out until the next person opens Xcode locally. This
# workflow is that missing compiler check, running automatically on every
# push instead of only whenever someone happens to build by hand.
#
# CODE_SIGNING_ALLOWED=NO/CODE_SIGNING_REQUIRED=NO/CODE_SIGN_IDENTITY="" is
# the standard trio for a CI build against a project that has a real
# DEVELOPMENT_TEAM set (see project.yml) — a Simulator build never needs an
# actual signing identity, and this skips code-signing entirely rather than
# requiring this repo's real Apple Developer credentials to exist as CI
# secrets.
#
# Deliberately scoped to a plain `xcodebuild build` only, not the unit
# tests: `xcodebuild build-for-testing`/`test` reliably fail here with
# "Could not find test host for HomeEatsTests" at xcodebuild's own upfront
# test-plan validation, before a single file compiles — reproduced across
# five different flag/step combinations (the signing trio alone, splitting
# build-for-testing from test-without-building, building the HomeEats
# target directly first) without resolving it, even once the app target
# genuinely finished building successfully first. This looks like a
# CI-environment-specific quirk in Xcode 16's test-plan validation on a
# from-scratch checkout, not a problem with this project's code — the same
# test target builds and runs fine locally in Xcode. Per team decision,
# CI now verifies compilation only; running the unit test suite stays a
# local/Xcode task until this is worth revisiting.
name: iOS Build

on:
  push:
    branches:
      - "claude/**"
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Picks whichever Xcode version is newest on this runner image,
      # rather than hardcoding one exact version/path that a future runner
      # image update could remove.
      - name: Select latest available Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app | sort -V | tail -n1)"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # The .xcodeproj itself is gitignored (see .gitignore) — this is the
      # same step anyone pulling the repo locally has to run before opening
      # it in Xcode; see project.yml for the actual project definition.
      - name: Generate Xcode project
        run: xcodegen generate

      # Picks whichever iOS Simulator runtime is actually newest on this
      # runner, rather than a hardcoded device+OS pair — the very first run
      # of this workflow failed here (`error: Unable to find a device
      # matching the provided destination specifier`) because "iPhone 15"
      # with no OS pinned defaulted to the newest iOS on the runner, and
      # this runner's iPhone 15 simulators only go up through 17.5 — the
      # newest runtime it actually has (18.2) only ships iPhone 16
      # simulators. `simctl list` finds a real, currently-installed
      # `iPhone-1[5-9]` runtime and lets it float forward automatically the
      # next time GitHub updates this runner image's simulators, instead of
      # needing a manual bump here every time.
      - name: Find a usable iOS Simulator destination
        id: sim
        run: |
          set -o pipefail
          # One-line `python3 -c` scripts (not a multi-line embedded
          # script) — YAML's `|` block scalar requires every line to stay
          # indented at least as much as the block's first line, which a
          # multi-line string literal breaks the moment it's pasted in at
          # column 0; single-line scripts sidestep that entirely.
          #
          # Version sorted as a tuple of ints, not as a raw string — a
          # plain string sort would misorder e.g. '17.10' before '17.9'.
          RUNTIME_ID="$(xcrun simctl list runtimes available -j | python3 -c "import json,sys; rts=[r for r in json.load(sys.stdin)['runtimes'] if r['identifier'].startswith('com.apple.CoreSimulator.SimRuntime.iOS-')]; rts.sort(key=lambda r: tuple(int(p) for p in r['version'].split('.'))); print(rts[-1]['identifier'])")"
          # Any available iPhone on that runtime works equally well here —
          # this is just picking a destination xcodebuild can actually run
          # on, not choosing a "best" device.
          DEVICE_NAME="$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices'].get('$RUNTIME_ID', []); ip=[x for x in d if x['name'].startswith('iPhone')]; print(ip[0]['name'])")"
          echo "Using device '$DEVICE_NAME' on runtime $RUNTIME_ID"
          echo "device_name=$DEVICE_NAME" >> "$GITHUB_OUTPUT"

      - name: Build app (iOS Simulator, unsigned)
        run: |
          set -o pipefail
          xcodebuild build \
            -project HomeEats.xcodeproj \
            -scheme HomeEats \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.device_name }},OS=latest" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
