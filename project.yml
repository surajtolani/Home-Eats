name: HomeEats
options:
  bundleIdPrefix: family.homeeats
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_ASSET_PATHS: ""
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  HomeEats:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HomeEats
    resources:
      - path: HomeEats/Resources
    info:
      path: HomeEats/Supporting/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleDisplayName: Home Eats
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Home Eats uses your camera to photograph a recipe (a cookbook page, a recipe card, a handwritten note) so it can be added to your recipe box."
        NSLocationWhenInUseUsageDescription: "Home Eats uses your location to show nearby restaurants first when you search."
        UIAppFonts:
          - Nunito-Light.ttf
          - Nunito-Regular.ttf
          - Nunito-Medium.ttf
          - Nunito-SemiBold.ttf
          - Nunito-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: family.homeeats.app
        PRODUCT_NAME: "Home Eats"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies: []

  HomeEatsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HomeEatsTests
    dependencies:
      - target: HomeEats
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HomeEats:
    build:
      targets:
        HomeEats: all
        HomeEatsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HomeEatsTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
