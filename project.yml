name: HomeEats
options:
  bundleIdPrefix: family.homeeats
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  usesTabs: false
  indentWidth: 4
  tabWidth: 4

settings:
  base:
    SWIFT_VERSION: 5.0
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    # "1,2" = iPhone + iPad, so the same build installs and runs on either —
    # still portrait-only/UIRequiresFullScreen everywhere, so on iPad this
    # runs full-screen in the standard iPhone-compatibility scaled window
    # rather than a native iPad layout (nothing here has been built with
    # size classes/adaptive layout for a real iPad-optimized UI yet). Fine
    # for functional testing; a proper iPad layout is separate, later work.
    TARGETED_DEVICE_FAMILY: "1,2"
    ENABLE_PREVIEWS: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    DEVELOPMENT_ASSET_PATHS: ""
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  HomeEats:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HomeEats
    resources:
      - path: HomeEats/Resources
    info:
      path: HomeEats/Supporting/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Without this, App Store Connect requires all 4 orientations to be
        # declared (to support iPad Split View/Slide Over multitasking),
        # even for an iPhone-only, portrait-only app like this one. This
        # tells Apple the app doesn't support multitasking at all, which is
        # true by design here — not a workaround, the accurate declaration.
        UIRequiresFullScreen: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        CFBundleDisplayName: Home Eats
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: "Home Eats uses your camera to photograph a recipe (a cookbook page, a recipe card, a handwritten note) so it can be added to your recipe box."
        NSLocationWhenInUseUsageDescription: "Home Eats uses your location to show nearby restaurants first when you search."
        NSContactsUsageDescription: "Home Eats can search your contacts to find a friend's phone number when adding them to a group."
        UIAppFonts:
          - Nunito-Light.ttf
          - Nunito-Regular.ttf
          - Nunito-Medium.ttf
          - Nunito-SemiBold.ttf
          - Nunito-Bold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: family.homeeats.app
        PRODUCT_NAME: "Home Eats"
        # Pinned so Xcode's Signing & Capabilities team selection survives
        # `xcodegen generate` — without this, regenerating the project (e.g.
        # after pulling new files) silently reverts to no team selected,
        # which is the "Signing for HomeEats requires a development team"
        # error. CODE_SIGN_STYLE: Automatic lets Xcode still manage
        # provisioning profiles itself once this team is set.
        DEVELOPMENT_TEAM: N9Z99NUSB9
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        # Apple requires every new TestFlight/App Store upload to have a
        # strictly higher build number than the last one uploaded for this
        # bundle ID — bump this by 1 each time you archive+upload a new
        # build, even though MARKETING_VERSION (the version testers see)
        # can stay the same across several TestFlight builds.
        CURRENT_PROJECT_VERSION: "5"
    dependencies: []

  HomeEatsTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: HomeEatsTests
    dependencies:
      - target: HomeEats
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  HomeEats:
    build:
      targets:
        HomeEats: all
        HomeEatsTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - HomeEatsTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
